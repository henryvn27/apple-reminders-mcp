name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON metadata
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool plugins/apple-reminders/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/apple-reminders/.mcp.json >/dev/null
      - name: Test MCP server
        run: python3 -m unittest discover -s plugins/apple-reminders/tests -v
      - name: Compile bridges
        run: |
          python3 -m py_compile plugins/apple-reminders/server.py
          osacompile -l JavaScript -o /tmp/apple-reminders.scpt plugins/apple-reminders/reminders.js
